<div *ngIf="layout.isSidebarOpen()" 
     (click)="layout.closeSidebar()"
     class="fixed inset-0 z-20 bg-black/50 transition-opacity md:hidden">
</div>

<aside 
  class="fixed inset-y-0 left-0 z-30 flex flex-col bg-slate-900 text-white transition-all duration-300 md:relative"
  [class.translate-x-0]="layout.isSidebarOpen()"
  [class.-translate-x-full]="!layout.isSidebarOpen()"
  [class.md:translate-x-0]="true"
  [class.w-64]="!layout.isSidebarCollapsed()"
  [class.md:w-20]="layout.isSidebarCollapsed()">

  <div routerLink="/" class="flex h-16 items-center justify-center border-b border-white/10 font-bold text-xl flex-shrink-0 cursor-pointer">
    <span class="text-blue-500">
      <img src="/pos.png" alt="Logo">
    </span>
    <span *ngIf="!layout.isSidebarCollapsed()" 
          class="ml-2 transition-opacity duration-200 whitespace-nowrap">
      Mini POS
    </span>
  </div>

<nav class="flex-1 flex flex-col gap-1 p-3 overflow-y-auto overflow-x-hidden">
  
  <ng-container *ngFor="let item of menuItems">

    <a *ngIf="!item.children"
       [routerLink]="item.link"
       routerLinkActive="bg-blue-600 text-white shadow-lg"
       [routerLinkActiveOptions]="{ exact: item.link === '/' }"
       (click)="layout.closeSidebar()"
       (mouseenter)="showTooltip($event, item.label)"
       (mouseleave)="hideTooltip()"
       class="flex items-center rounded-lg px-3 py-3 text-slate-300 hover:bg-white/10 hover:text-white transition-colors group cursor-pointer">
      <span class="text-xl min-w-[24px] text-center">{{ item.icon }}</span>
      <span *ngIf="!layout.isSidebarCollapsed()" class="ml-3 font-medium whitespace-nowrap transition-opacity">
        {{ item.label }}
      </span>
    </a>

    <div *ngIf="item.children" class="flex flex-col">
      
      <div (click)="toggleMenu(item)"
           (mouseenter)="showTooltip($event, item.label)"
           (mouseleave)="hideTooltip()"
           class="flex items-center justify-between rounded-lg px-3 py-3 text-slate-300 hover:bg-white/10 hover:text-white transition-colors cursor-pointer select-none">
        
        <div class="flex items-center">
          <span class="text-xl min-w-[24px] text-center">{{ item.icon }}</span>
          <span *ngIf="!layout.isSidebarCollapsed()" class="ml-3 font-medium whitespace-nowrap transition-opacity">
            {{ item.label }}
          </span>
        </div>

        <svg *ngIf="!layout.isSidebarCollapsed()"
             [class.rotate-180]="item.expanded"
             class="w-4 h-4 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </div>

      <div *ngIf="item.expanded && !layout.isSidebarCollapsed()"
           class="flex flex-col gap-1 mt-1 pl-4 ml-3 border-l border-slate-700 overflow-hidden animate-fade-in">
        
        <a *ngFor="let child of item.children"
           [routerLink]="child.link"
           routerLinkActive="bg-blue-600/50 text-white font-medium"
           (click)="layout.closeSidebar()"
           class="flex items-center rounded-lg px-3 py-2 text-sm text-slate-400 hover:bg-white/10 hover:text-white transition-colors cursor-pointer">
          <span class="text-lg min-w-[20px] text-center mr-2">{{ child.icon }}</span>
          <span>{{ child.label }}</span>
        </a>
        
      </div>

    </div>

  </ng-container>
</nav>

  <div class="p-4 border-t border-white/10 text-xs text-slate-500 text-center flex-shrink-0">
     <span *ngIf="!layout.isSidebarCollapsed()">v1.0.0</span>
     <span *ngIf="layout.isSidebarCollapsed()">v1</span>
  </div>

  <div *ngIf="tooltip().visible && layout.isSidebarCollapsed()"
       class="fixed z-50 left-20 ml-2 rounded bg-slate-800 px-3 py-1.5 text-xs font-medium text-white shadow-xl whitespace-nowrap animate-fade-in"
       [style.top.px]="tooltip().top">
       
       <div class="absolute top-1/2 -left-1 -mt-1 h-2 w-2 -rotate-45 bg-slate-800"></div>
       
       {{ tooltip().label }}
  </div>

</aside>
