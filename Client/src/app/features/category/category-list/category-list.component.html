<div class="flex flex-col h-full bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between">
        <h1 class="text-xl font-bold text-gray-900 tracking-tight">Quản lý Danh mục</h1>
        <app-button variant="primary" (click)="onCreate()">+ Add New</app-button>
    </div>

    <div class="flex-1 p-0 overflow-hidden relative">
        <app-table [data]="filteredCategories()" [columns]="columns()" [searchable]="true" (search)="onSearch($event)"
            [exportable]="true" [pagination]="true" [page]="currentPage()" [pageSize]="100">
        </app-table>
    </div>
</div>

<ng-template #actionTemplate let-category>
    <div class="flex gap-2" (click)="$event.stopPropagation()">
        <app-button variant="primary" (click)="onEdit(category)">Edit</app-button>
        <app-button variant="danger" (click)="onDelete(category)">Delete</app-button>
    </div>
</ng-template>

<app-modal
    [isOpen]="isOpenModal()"
    [title]="selectedCategory() ? 'Cập nhật Danh mục' : 'Thêm mới Danh mục'"
    (close)="onCloseModal()"
    size="lg">
    <app-category-form
        [initialData]="selectedCategory()"
        (save)="onHandleSave($event)"
        (cancel)="onCloseModal()">
    </app-category-form>
</app-modal>
