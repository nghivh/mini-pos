<div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
    <div>
        <h1 class="text-2xl font-bold text-gray-900">User Management</h1>
        <p class="text-gray-500 mt-1">Selected: <b>{{ selectedUsers().length }}</b> rows.</p>
    </div>
    <app-button variant="primary" (click)="onOpenModal()">
        + Add User
    </app-button>
</div>
<app-table [data]="filteredUsers()" [columns]="columns()" [loading]="loading()" [selectable]="true" [searchable]="true" [exportable]="true"
    (search)="onSearch($event)" [pagination]="true" [page]="currentPage()" [pageSize]="10"
    [totalRecords]="filteredUsers().length" (pageChange)="onPageChange($event)" (selectionChange)="onSelectionChange($event)">
</app-table>

<ng-template #userTemplate let-user>
    <div class="flex items-center gap-3">
        <img [src]="user.avatar || 'https://ui-avatars.com/api/?name='+user.name"
            class="w-8 h-8 rounded-full bg-gray-200 object-cover">
        <span class="font-medium text-gray-900">{{ user.name }}</span>
    </div>
</ng-template>

<ng-template #statusTemplate let-user>
    <app-badge [variant]="user.status === 'Active' ? 'success' : 'gray'">
        {{ user.status }}
    </app-badge>
</ng-template>

<ng-template #actionTemplate let-user>
    <div class="flex gap-2" (click)="$event.stopPropagation()">
        <button class="text-blue-600 hover:text-blue-800 text-xs font-medium" (click)="onEdit(user)">Edit</button>
        <span class="text-gray-300">|</span>
        <button class="text-red-600 hover:text-red-800 text-xs font-medium" (click)="onDelete(user)">Delete</button>
    </div>
</ng-template>

<app-modal
    [isOpen]="isModalOpen()"
    [title]="selectedUser() ? 'Edit User' : 'Create New User'"
    size="lg"
    (close)="closeModal()"
>
    <app-user-form
        [initialData]="selectedUser()"
        [loading]="submitting()"
        (save)="handleSave($event)"
        (cancel)="closeModal()">

    </app-user-form>
</app-modal>
