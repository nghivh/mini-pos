<form [formGroup]="form" class="flex flex-col gap-5">
    <app-input
        label="Full Name"
        placeholder="Ex: John Doe"
        formControlName="name">
    </app-input>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
        <app-input
            label="Email"
            type="email"
            formControlName="email">
        </app-input>

        <app-select-search
            label="Role"
            placeholder="Select Role"
            formControlName="role"
            [options]="roleOptions">            
        </app-select-search>
    </div>

    <app-checkbox formControlName="status">Active User</app-checkbox>

    <div class="flex w-full justify-end gap-3 pt-4 border-t mt-2">
        <app-button variant="outline" (click)="onCancel()">Cancel</app-button>

        <app-button 
            variant="primary"
            (click)="onSubmit()"
            [disabled]="form.invalid || loading()">
            {{ loading() ? 'Saving...' : (initialData() ? 'Update' : 'Create') }}
        </app-button>
    </div>
</form>
